spring:
  application:
    name: vietblog-backend

  # ── Database (PostgreSQL + PostGIS + pgvector) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vietblog}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Redis 7+ (Distributed Cache + Chat Pub/Sub) ──
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL:false}

  # ── File Upload ───────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ── Server ────────────────────────────────
server:
  port: ${PORT:8080}

# ── Real-time Chat Redis Pub/Sub ("auto" | "true" | "false") ──
chat:
  redis:
    enabled: ${CHAT_REDIS_ENABLED:auto}

# ── JWT ───────────────────────────────────
jwt:
  secret: ${JWT_SECRET:VietBlog2026SecretKeyForJWTTokenGenerationMustBeAtLeast256Bits}
  access-token-expiration: 86400000   # 24 hours
  refresh-token-expiration: 604800000 # 7 days
  ws-ticket-expiration: ${JWT_WS_TICKET_EXPIRATION:3600000} # 1 hour
  cookie:
    access-name: ${JWT_ACCESS_COOKIE_NAME:vietblog_access_token}
    refresh-name: ${JWT_REFRESH_COOKIE_NAME:vietblog_refresh_token}
    status-name: ${JWT_STATUS_COOKIE_NAME:vietblog_logged_in}
    secure: ${JWT_COOKIE_SECURE:false}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}
    domain: ${JWT_COOKIE_DOMAIN:}

# ── CORS ──────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

