spring:
  application:
    name: vietblog-backend

  # ── Database ──────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/vietblog
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Redis ─────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ── File Upload ───────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ── Server ────────────────────────────────
server:
  port: 8080

# ── JWT ───────────────────────────────────
jwt:
  secret: VietBlog2026SecretKeyForJWTTokenGenerationMustBeAtLeast256Bits
  access-token-expiration: 86400000   # 24 hours
  refresh-token-expiration: 604800000 # 7 days

# ── CORS ──────────────────────────────────
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000
