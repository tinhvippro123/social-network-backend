spring:
  application:
    name: vietblog-backend

  # ── Database (PostgreSQL + PostGIS + pgvector) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vietblog}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Redis 7+ (Distributed Cache + Chat Pub/Sub) ──
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # ── File Upload ───────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ── Server ────────────────────────────────
server:
  port: ${PORT:8080}

# ── Real-time Chat Redis Pub/Sub ("auto" | "true" | "false") ──
chat:
  redis:
    enabled: ${CHAT_REDIS_ENABLED:auto}

# ── JWT ───────────────────────────────────
jwt:
  secret: ${JWT_SECRET:VietBlog2026SecretKeyForJWTTokenGenerationMustBeAtLeast256Bits}
  access-token-expiration: 86400000   # 24 hours
  refresh-token-expiration: 604800000 # 7 days

# ── CORS ──────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ── Cloudinary ────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dan2b8knu}
  api-key: ${CLOUDINARY_API_KEY:432231466341726}
  api-secret: ${CLOUDINARY_API_SECRET:xBGOokPoQSU9TBt1ry7OMqWaz_s}

# ── Google OAuth ─────────────────────────
